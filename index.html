<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="stylesheet" href="style.css">
    <title>大富翁</title>
  </head>

  <body>

    <!-- ── 菜单界面 ── -->
    <div id="menu-screen" class="screen active">
    <div class="logo-area">
      <div class="logo-title">🎩<text>大富翁</text>🎩</div>
      <div class="logo-sub">MONOPOLY</div>
    </div>
    <div class="menu-card">
      <div class="menu-label">选择玩家人数</div>
      <div class="player-count-row" id="count-row">
        <button class="count-btn" data-count="2">2</button>
        <button class="count-btn selected" data-count="3">3</button>
        <button class="count-btn" data-count="4">4</button>
        <button class="count-btn" data-count="5">5</button>
        <button class="count-btn" data-count="6">6</button>
      </div>
      <!-- <div style="height:1px;background:rgba(255,255,255,0.06)"></div> -->
      <div class="money-input-row">
        <label for="init-money">初始资金</label>
        <input type="number" id="init-money" value="15000" min="1000" max="100000" step="1000">
      </div>
      <div class="money-input-row">
        <label for="init-reward">起点奖励</label>
        <input type="number" id="init-reward" value="2000" min="1000" max="10000" step="1000">
      </div>
      <button class="start-btn" id="start-btn">开 始 游 戏</button>
    </div>
  </div>  


  <!-- ── 游戏界面 ── -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <button class="icon-btn" id="exit-btn">✕ 退出</button>
    </div>
    <div class="players-container" id="players-container"></div>
    <div class="dice-area">
      <div class="dice-box">
        <button class="roll-btn" id="roll-btn">🎲投掷</button>
        <div class="dice-count-row" id="dice-count-row">
          <button class="dice-count-btn" data-count="1">🎲×1</button>
          <button class="dice-count-btn" data-count="2">🎲×2</button>
          <button class="dice-count-btn selected" data-count="3">🎲×3</button>
          <button class="dice-count-btn" data-count="4">🎲×4</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 骰子动画遮罩 ── -->
  <div class="dice-overlay" id="dice-overlay">
    <div class="dice-row">
      <div class="big-die" id="big-die1"></div>
      <div class="big-die" id="big-die2"></div>
      <div class="big-die" id="big-die3"></div>
      <div class="big-die" id="big-die4"></div>
    </div>
    <div class="overlay-result" id="overlay-result"></div>
  </div>

  <!-- ── 通用弹窗 ── -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <div class="modal-msg" id="modal-msg"></div>
      <div class="modal-btns">
        <button class="modal-btn cancel" id="modal-cancel">取消</button>
        <button class="modal-btn confirm" id="modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 基础公共模块：最先加载 -->
  <script src="eventBus.js"></script>
  <!-- 其他模块顺序随意，互不依赖 -->
  <script src="audio.js"></script>
  <script src="menu.js"></script>
  <script src="game.js"></script>

  </body>
</html>
